name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python || '3.11' }}

      - name: Sync dependencies
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (full package)
        run: uv run mypy mewcode

      - name: Engineering guards
        run: uv run --locked python scripts/engineering_guards.py

      - name: Lock consistency
        run: uv lock --check

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -q --maxfail=10 --timeout=120 2>&1 | tee pytest.log
          exit ${PIPESTATUS[0]}

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-${{ matrix.os }}-${{ matrix.python }}
          path: pytest.log
          retention-days: 7

  security:
    # 高危告警通道：权限安全回归套件独立跑，失败即阻塞合并。
    name: security regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python || '3.11' }}

      - name: Sync dependencies
        run: uv sync --locked

      - name: Permission security regression
        shell: bash
        run: |
          set -o pipefail
          uv run pytest tests/test_permission_security.py -q --maxfail=1 --timeout=120 2>&1 | tee security.log
          exit ${PIPESTATUS[0]}

      - name: Audit locked dependencies
        run: uv run pip-audit --local

      - name: Restored defect verification
        run: uv run --locked python scripts/verify_restored_defects.py

      - name: Upload security log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: security-log
          path: security.log
          retention-days: 7
